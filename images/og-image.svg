<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2557"/>
      <stop offset="100%" style="stop-color:#1A56DB"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Mountain silhouette -->
  <path fill="url(#mountain)" d="M0,630 L0,420 L100,320 L180,380 L300,260 L420,330 L520,200 L620,280 L720,160 L820,240 L940,120 L1040,200 L1140,150 L1200,180 L1200,630 Z"/>

  <!-- White card area -->
  <rect x="60" y="60" width="680" height="510" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- House icon circle -->
  <circle cx="160" cy="185" r="52" fill="rgba(255,255,255,0.15)"/>
  <text x="160" y="200" font-size="48" text-anchor="middle" font-family="Arial">🏠</text>

  <!-- Brand name -->
  <text x="230" y="170" font-size="52" font-weight="800" font-family="Arial, sans-serif" fill="white">Ghar</text>
  <text x="370" y="170" font-size="52" font-weight="800" font-family="Arial, sans-serif" fill="#60a5fa">Khoj</text>
  <text x="230" y="210" font-size="20" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.65)">.com.np</text>

  <!-- Divider -->
  <line x1="100" y1="240" x2="680" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Headline -->
  <text x="100" y="305" font-size="38" font-weight="700" font-family="Arial, sans-serif" fill="white">Nepal's Trusted</text>
  <text x="100" y="355" font-size="38" font-weight="700" font-family="Arial, sans-serif" fill="white">Property Search</text>

  <!-- Subtext -->
  <text x="100" y="405" font-size="22" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.75)">Find rooms, flats, houses &amp; land.</text>
  <text x="100" y="435" font-size="22" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.75)">No broker fees. Direct owner contact.</text>

  <!-- Badges row -->
  <rect x="100" y="465" width="140" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
  <text x="170" y="489" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="white">🆓 Free Search</text>

  <rect x="252" y="465" width="150" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
  <text x="327" y="489" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="white">✓ Verified Listings</text>

  <rect x="414" y="465" width="140" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
  <text x="484" y="489" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="white">🇳🇵 Nepal-First</text>

  <!-- Right side stats -->
  <rect x="800" y="140" width="340" height="350" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <text x="970" y="200" font-size="18" text-anchor="middle" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.7)" font-weight="600" letter-spacing="2">TRUSTED BY</text>

  <text x="970" y="270" font-size="64" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif" fill="white">10K+</text>
  <text x="970" y="305" font-size="20" text-anchor="middle" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.7)">Nepalis</text>

  <line x1="840" y1="330" x2="1120" y2="330" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Mini stats -->
  <text x="905" y="375" font-size="32" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif" fill="#60a5fa">250+</text>
  <text x="905" y="400" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.6)">Listings</text>

  <text x="1035" y="375" font-size="32" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif" fill="#60a5fa">8</text>
  <text x="1035" y="400" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.6)">Cities</text>

  <!-- Bottom URL bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="600" y="612" font-size="20" text-anchor="middle" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.8)" font-weight="600">gharkhoj.com.np — Search. Contact. Move In.</text>
</svg>
