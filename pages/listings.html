<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all property listings in Nepal. Filter by type, city, price and purpose. Find rooms, flats, houses and land for rent or sale.">
  <meta name="keywords" content="property listings nepal, room rent kathmandu, flat rent pokhara, house sale nepal, land sale nepal, kotha bhadama">
  <link rel="canonical" href="https://gharkhoj.com.np/pages/listings.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GharKhoj.com.np">
  <meta property="og:title" content="Browse Properties — GharKhoj.com.np">
  <meta property="og:description" content="Search verified rooms, flats, houses and land across Nepal. Filter by city, type, price. No broker fees.">
  <meta property="og:url" content="https://gharkhoj.com.np/pages/listings.html">
  <meta property="og:image" content="https://gharkhoj.com.np/images/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://gharkhoj.com.np/images/og-image.svg">
  <!-- Google Analytics -->
  <!-- Google Analytics — replace G-XXXXXXXXXX with your real Measurement ID -->
  <!-- Get yours free at: https://analytics.google.com → Admin → Create Property -->
  <script>
    const GA_ID = 'G-XXXXXXXXXX'; // ← Replace this
    if (GA_ID !== 'G-XXXXXXXXXX') {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', GA_ID);
    }
  </script>
  <title>Properties — GharKhoj.com.np</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🏠</text></svg>">
  <style>
    .listings-hero {
      background: linear-gradient(135deg, #0f2557, #1A56DB);
      padding: 40px 0;
      color: white;
    }
    .listings-hero h1 { color: white; font-size: 28px; margin-bottom: 6px; }
    .listings-hero p  { color: rgba(255,255,255,0.75); font-size: 15px; }

    .filter-bar {
      background: white;
      border-bottom: 1.5px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: var(--nav-h);
      z-index: 100;
      box-shadow: 0 2px 8px rgba(30,41,59,0.06);
    }
    .filter-inner {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-input {
      flex: 1;
      min-width: 180px;
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .filter-input:focus { border-color: var(--blue); }
    .filter-select {
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      background: white;
      outline: none;
      cursor: pointer;
      color: var(--slate);
    }
    .filter-select:focus { border-color: var(--blue); }
    .filter-clear {
      font-size: 13px;
      color: var(--muted);
      padding: 9px 12px;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .filter-clear:hover { background: var(--bg); color: var(--red); }

    .listings-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .results-count {
      font-size: 15px;
      font-weight: 600;
      color: var(--slate);
    }
    .sort-select {
      padding: 7px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--slate);
      outline: none;
      cursor: pointer;
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .listings-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .listings-grid { grid-template-columns: 1fr; }
      .filter-inner { gap: 8px; }
      .filter-input { min-width: 100%; }
    }

    /* Amenity chips */
    .amenity-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 20px;
      border: 1.5px solid var(--border); background: white;
      font-size: 13px; cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .amenity-chip:hover { border-color: var(--blue); color: var(--blue); }
    .amenity-chip input { width: 14px; height: 14px; accent-color: var(--blue); cursor: pointer; }
    .amenity-chip:has(input:checked) { background: var(--blue-light); border-color: var(--blue); color: var(--blue); font-weight: 600; }

    /* Wishlist button */
    .wishlist-btn {
      position: absolute; top: 10px; right: 10px;
      width: 34px; height: 34px; border-radius: 50%;
      background: white; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: transform 0.15s; z-index: 2;
    }
    .wishlist-btn:hover { transform: scale(1.15); }
    .wishlist-btn.saved { background: #fef2f2; }

    /* Compare checkbox on card */
    .compare-check-wrap {
      position: absolute; top: 10px; left: 10px; z-index: 2;
    }
    .compare-check-wrap input[type=checkbox] {
      width: 18px; height: 18px; accent-color: var(--blue); cursor: pointer;
    }

    /* Card image wrapper needs position relative */
    .property-card__img { position: relative; }

    /* Compare table */
    #compareTable table { width: 100%; border-collapse: collapse; font-size: 14px; }
    #compareTable th { background: var(--blue); color: white; padding: 10px 14px; text-align: left; }
    #compareTable td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    #compareTable tr:nth-child(even) td { background: var(--bg); }
    #compareTable .check-yes { color: #16a34a; font-weight: 600; }
    #compareTable .check-no  { color: #dc2626; }

    /* AI search input placeholder */
    #aiSearchInput::placeholder { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>

<div id="navbar-root"></div>

<!-- Page Hero -->
<div class="listings-hero">
  <div class="container">
    <h1 id="pageTitle">All Properties in Nepal</h1>
    <p id="pageSubtitle">Browse verified listings — rooms, flats, houses, land, commercial</p>
  </div>
</div>

<!-- AI Smart Search Bar -->
<div style="background:linear-gradient(135deg,#0f2557,#1A56DB);padding:20px 0">
  <div class="container">
    <div style="display:flex;gap:10px;align-items:center">
      <div style="flex:1;position:relative">
        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px">🤖</span>
        <input type="text" id="aiSearchInput" placeholder='Try: "2BHK flat near Pulchowk under Rs 15,000 with parking"'
          style="width:100%;padding:13px 16px 13px 44px;border-radius:10px;border:none;font-size:14px;box-sizing:border-box;background:rgba(255,255,255,0.12);color:white;outline:none"
          onkeydown="if(event.key==='Enter')runAISearch()"
          onfocus="this.style.background='rgba(255,255,255,0.2)'"
          onblur="this.style.background='rgba(255,255,255,0.12)'"
          oninput="if(!this.value.trim())clearAISearch()">
      </div>
      <button onclick="runAISearch()" style="background:white;color:var(--blue);border:none;padding:13px 20px;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:14px">
        AI Search ✨
      </button>
    </div>
    <p id="aiStatus" style="color:rgba(255,255,255,0.7);font-size:12px;margin:8px 0 0;min-height:18px"></p>
  </div>
</div>

<!-- Filter Bar -->
<div class="filter-bar" role="search" aria-label="Property filters">
  <div class="container">
    <div class="filter-inner">
      <input type="text" id="searchQ" class="filter-input" data-i18n-ph="search_placeholder" placeholder="Search city, area, location..." aria-label="Search">
      <select id="filterType" class="filter-select" aria-label="Property type">
        <option value="" data-i18n="filter_all_types">All Types</option>
        <option value="room">Room</option>
        <option value="flat">Flat</option>
        <option value="house">House</option>
        <option value="land">Land</option>
        <option value="commercial">Commercial</option>
      </select>
      <select id="filterPurpose" class="filter-select" aria-label="Purpose">
        <option value="" data-i18n="filter_all_purpose">Rent or Buy</option>
        <option value="rent">For Rent</option>
        <option value="buy">For Sale</option>
      </select>
      <select id="filterCity" class="filter-select" aria-label="City">
        <option value="" data-i18n="filter_all_cities">All Cities</option>
        <option value="Kathmandu">Kathmandu</option>
        <option value="Lalitpur">Lalitpur</option>
        <option value="Bhaktapur">Bhaktapur</option>
        <option value="Pokhara">Pokhara</option>
        <option value="Chitwan">Chitwan</option>
        <option value="Butwal">Butwal</option>
      </select>
      <select id="filterPrice" class="filter-select" aria-label="Price range">
        <option value="">Any Price</option>
        <option value="0-5000">Under Rs 5,000</option>
        <option value="0-10000">Under Rs 10,000</option>
        <option value="10000-20000">Rs 10K – 20K</option>
        <option value="20000-50000">Rs 20K – 50K</option>
        <option value="50000-100000">Rs 50K – 1 Lakh</option>
        <option value="100000-999999999">Above Rs 1 Lakh</option>
      </select>
      <button class="filter-clear" id="moreFiltersBtn" onclick="toggleAdvancedFilters()" style="background:var(--blue-light);color:var(--blue);border:1.5px solid #bfdbfe">⚙ More Filters</button>
      <button class="filter-clear" onclick="clearFilters()" aria-label="Clear all filters">✕ Clear</button>
    </div>

    <!-- Advanced Filters Panel -->
    <div id="advancedFilters" style="display:none;padding:16px 0 4px;border-top:1.5px solid var(--border);margin-top:12px">
      <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">

        <!-- Amenities -->
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Amenities</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <label class="amenity-chip"><input type="checkbox" id="f-furnished" onchange="applyFilters()"> 🛋 Furnished</label>
            <label class="amenity-chip"><input type="checkbox" id="f-parking"   onchange="applyFilters()"> 🚗 Parking</label>
            <label class="amenity-chip"><input type="checkbox" id="f-wifi"      onchange="applyFilters()"> 📶 WiFi</label>
            <label class="amenity-chip"><input type="checkbox" id="f-attached"  onchange="applyFilters()"> 🚿 Attached Bath</label>
            <label class="amenity-chip"><input type="checkbox" id="f-water"     onchange="applyFilters()"> 💧 24hr Water</label>
          </div>
        </div>

        <!-- Budget Slider -->
        <div style="min-width:240px;flex:1">
          <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">
            Budget: <span id="budgetLabel" style="color:var(--blue);font-weight:700">Any</span>
          </div>
          <input type="range" id="budgetSlider" min="0" max="100000" step="1000" value="100000"
            style="width:100%;accent-color:var(--blue)" oninput="onBudgetSlide(this.value)">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px">
            <span>Rs 0</span><span>Rs 25K</span><span>Rs 50K</span><span>Rs 75K</span><span>Rs 1L+</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Compare Bar (shows when 2 items selected) -->
<div id="compareBar" style="display:none;position:sticky;top:0;z-index:200;background:var(--blue);color:white;padding:10px 0;box-shadow:0 2px 12px rgba(26,86,219,0.3)">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="font-size:14px;font-weight:600">⚖️ <span id="compareCount">0</span> properties selected for comparison</div>
    <div style="display:flex;gap:8px">
      <button onclick="openCompare()" style="background:white;color:var(--blue);border:none;padding:7px 16px;border-radius:7px;font-weight:700;cursor:pointer">Compare Now</button>
      <button onclick="clearCompare()" style="background:rgba(255,255,255,0.15);color:white;border:none;padding:7px 12px;border-radius:7px;cursor:pointer">Clear</button>
    </div>
  </div>
</div>

<!-- Compare Modal -->
<div id="compareModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;overflow-y:auto;padding:20px">
  <div style="max-width:800px;margin:0 auto;background:white;border-radius:16px;padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="margin:0">⚖️ Property Comparison</h2>
      <button onclick="document.getElementById('compareModal').style.display='none'" style="background:none;border:none;font-size:24px;cursor:pointer">✕</button>
    </div>
    <div id="compareTable"></div>
  </div>
</div>

<!-- Main Content -->
<div class="container section-sm">
  <div class="listings-layout">
    <div>
      <div class="results-bar">
        <div class="results-count" id="resultsCount">Loading...</div>
        <select class="sort-select" id="sortBy" aria-label="Sort by" onchange="applyFilters()">
          <option value="newest">Newest First</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="verified">Verified First</option>
        </select>
      </div>
      <div class="listings-grid" id="listingsGrid">
        <!-- Skeletons shown until JS loads -->
        <div class="property-card"><div class="skeleton" style="height:200px"></div><div style="padding:16px"><div class="skeleton" style="height:20px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:14px;width:75%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="property-card"><div class="skeleton" style="height:200px"></div><div style="padding:16px"><div class="skeleton" style="height:20px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:14px;width:75%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="property-card"><div class="skeleton" style="height:200px"></div><div style="padding:16px"><div class="skeleton" style="height:20px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:14px;width:75%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="property-card"><div class="skeleton" style="height:200px"></div><div style="padding:16px"><div class="skeleton" style="height:20px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:14px;width:75%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="property-card"><div class="skeleton" style="height:200px"></div><div style="padding:16px"><div class="skeleton" style="height:20px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:14px;width:75%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="property-card"><div class="skeleton" style="height:200px"></div><div style="padding:16px"><div class="skeleton" style="height:20px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:14px;width:75%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="../js/core.js"></script>
<script>
  document.getElementById('navbar-root').innerHTML = buildNavbar('nav_listings');
  document.getElementById('footer-root').innerHTML = buildFooter();

  const ITEMS_PER_PAGE = 9;
  let currentPage = 1;
  let filtered = [];
  let compareList = [];
  let wishlist = JSON.parse(localStorage.getItem('gk_wishlist') || '[]');
  let advancedOpen = false;
  let aiFilteredIds = null; // null = no AI filter active

  // Read URL params on load
  function initFromURL() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('q'))       document.getElementById('searchQ').value = p.get('q');
    if (p.get('type'))    document.getElementById('filterType').value = p.get('type');
    if (p.get('purpose')) document.getElementById('filterPurpose').value = p.get('purpose');
    if (p.get('city'))    document.getElementById('filterCity').value = p.get('city');
    updatePageTitle();
  }

  function updatePageTitle() {
    const type    = document.getElementById('filterType').value;
    const purpose = document.getElementById('filterPurpose').value;
    const city    = document.getElementById('filterCity').value;
    let title = 'All Properties';
    if (type)    title = type.charAt(0).toUpperCase() + type.slice(1) + 's';
    if (purpose) title += purpose === 'rent' ? ' for Rent' : ' for Sale';
    if (city)    title += ' in ' + city;
    else         title += ' in Nepal';
    document.getElementById('pageTitle').textContent = title;
    document.title = title + ' — GharKhoj.com.np';
  }

  function toggleAdvancedFilters() {
    advancedOpen = !advancedOpen;
    document.getElementById('advancedFilters').style.display = advancedOpen ? 'block' : 'none';
    document.getElementById('moreFiltersBtn').textContent = advancedOpen ? '✕ Hide Filters' : '⚙ More Filters';
  }

  function onBudgetSlide(val) {
    val = Number(val);
    document.getElementById('budgetLabel').textContent = val >= 100000 ? 'Any' : 'Up to Rs ' + val.toLocaleString();
    applyFilters();
  }

  function applyFilters() {
    currentPage = 1;
    const q       = document.getElementById('searchQ').value.toLowerCase();
    const type    = document.getElementById('filterType').value;
    const purpose = document.getElementById('filterPurpose').value;
    const city    = document.getElementById('filterCity').value;
    const price   = document.getElementById('filterPrice').value;
    const budget  = Number(document.getElementById('budgetSlider').value);
    const sort    = document.getElementById('sortBy').value;
    const chkFurnished = document.getElementById('f-furnished').checked;
    const chkParking   = document.getElementById('f-parking').checked;
    const chkWifi      = document.getElementById('f-wifi').checked;
    const chkBath      = document.getElementById('f-attached').checked;
    const chkWater     = document.getElementById('f-water').checked;

    filtered = allListings.filter(p => {
      if (aiFilteredIds && !aiFilteredIds.includes(String(p.id))) return false;
      if (type    && p.type !== type)       return false;
      if (purpose && p.purpose !== purpose) return false;
      if (city    && p.city !== city)       return false;
      if (price) {
        const [mn, mx] = price.split('-').map(Number);
        if (p.price < mn || p.price > mx) return false;
      }
      if (budget < 100000 && p.price > budget) return false;
      if (chkFurnished && !p.furnished)      return false;
      if (chkParking   && !p.parking)        return false;
      if (chkWifi      && !p.wifi)           return false;
      if (chkBath      && !p.attached_bath)  return false;
      if (chkWater     && !p.water_24hr)     return false;
      if (q) {
        const hay = [p.title, p.location, p.city, p.district, p.description,
                     ...(p.features || [])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    filtered.sort((a, b) => {
      if (sort === 'price_asc')  return a.price - b.price;
      if (sort === 'price_desc') return b.price - a.price;
      if (sort === 'verified')   return (b.verified ? 1 : 0) - (a.verified ? 1 : 0);
      return new Date(b.posted) - new Date(a.posted);
    });

    renderPage();
    updatePageTitle();
  }

  function renderPage() {
    const total = filtered.length;
    const pages = Math.ceil(total / ITEMS_PER_PAGE);
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const slice = filtered.slice(start, start + ITEMS_PER_PAGE);

    const count = document.getElementById('resultsCount');
    count.textContent = total === 0 ? 'No properties found' : `${total} propert${total === 1 ? 'y' : 'ies'} found`;

    const grid = document.getElementById('listingsGrid');
    if (slice.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🔍</div>
        <h3>No properties match your filters</h3>
        <p style="color:var(--muted)">Try removing some filters or broadening your search.</p>
        <button class="btn btn-primary" onclick="clearFilters()">Clear All Filters</button>
      </div>`;
    } else {
      grid.innerHTML = slice.map(p => propertyCardHTML(p, true)).join('');
      // Inject wishlist & compare buttons after each card image
      slice.forEach(p => {
        injectCardExtras(p);
      });
    }

    // Pagination
    const pages_el = document.getElementById('pagination');
    if (pages <= 1) { pages_el.innerHTML = ''; return; }
    let btns = '';
    for (let i = 1; i <= pages; i++) {
      btns += `<button class="page-btn${i === currentPage ? ' active' : ''}" onclick="goPage(${i})">${i}</button>`;
    }
    pages_el.innerHTML = `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${btns}</div>`;
  }

  function injectCardExtras(p) {
    // Add wishlist + compare buttons to each card
    const card = document.querySelector(`a[href*="id=${p.id}"]`);
    if (!card) return;
    const imgWrap = card.querySelector('.property-card__img');
    if (!imgWrap) return;
    imgWrap.style.position = 'relative';

    const isSaved = wishlist.includes(String(p.id));
    const isComparing = compareList.includes(String(p.id));

    // Wishlist heart
    const heart = document.createElement('button');
    heart.className = 'wishlist-btn' + (isSaved ? ' saved' : '');
    heart.innerHTML = isSaved ? '❤️' : '🤍';
    heart.title = isSaved ? 'Remove from saved' : 'Save listing';
    heart.onclick = (e) => { e.preventDefault(); e.stopPropagation(); toggleWishlist(String(p.id), heart); };
    imgWrap.appendChild(heart);

    // Compare checkbox
    const chkWrap = document.createElement('div');
    chkWrap.className = 'compare-check-wrap';
    chkWrap.innerHTML = `<input type="checkbox" title="Add to compare" ${isComparing ? 'checked' : ''} onchange="toggleCompare('${p.id}',this)" onclick="event.stopPropagation()">`;
    imgWrap.appendChild(chkWrap);
  }

  // ── Wishlist ──────────────────────────────────
  function toggleWishlist(id, btn) {
    const idx = wishlist.indexOf(id);
    if (idx === -1) {
      wishlist.push(id);
      btn.innerHTML = '❤️'; btn.classList.add('saved');
      showToastMsg('❤️ Saved to wishlist');
    } else {
      wishlist.splice(idx, 1);
      btn.innerHTML = '🤍'; btn.classList.remove('saved');
      showToastMsg('Removed from wishlist');
    }
    localStorage.setItem('gk_wishlist', JSON.stringify(wishlist));
  }

  function showToastMsg(msg) {
    let t = document.getElementById('gk-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'gk-toast';
      t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;pointer-events:none;transition:opacity 0.3s';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2000);
  }

  // ── Compare ──────────────────────────────────
  function toggleCompare(id, chk) {
    id = String(id);
    if (chk.checked) {
      if (compareList.length >= 2) {
        chk.checked = false;
        showToastMsg('You can compare up to 2 properties');
        return;
      }
      compareList.push(id);
    } else {
      compareList = compareList.filter(x => x !== id);
    }
    updateCompareBar();
  }

  function updateCompareBar() {
    const bar = document.getElementById('compareBar');
    bar.style.display = compareList.length >= 2 ? 'block' : 'none';
    document.getElementById('compareCount').textContent = compareList.length;
  }

  function clearCompare() {
    compareList = [];
    updateCompareBar();
    renderPage();
  }

  function openCompare() {
    const props = compareList.map(id => allListings.find(p => String(p.id) === id)).filter(Boolean);
    if (props.length < 2) return;
    const [a, b] = props;
    const rows = [
      ['Photo',         `<img src="${a.images?.[0]||''}" style="width:120px;height:80px;object-fit:cover;border-radius:6px">`,
                        `<img src="${b.images?.[0]||''}" style="width:120px;height:80px;object-fit:cover;border-radius:6px">`],
      ['Title',         a.title, b.title],
      ['Price',         `<strong style="color:var(--blue)">${a.price_label}</strong>`,
                        `<strong style="color:var(--blue)">${b.price_label}</strong>`],
      ['Type',          a.type, b.type],
      ['City',          a.city, b.city],
      ['Location',      a.location, b.location],
      ['Area',          a.area || '—', b.area || '—'],
      ['Bedrooms',      a.bedrooms || '—', b.bedrooms || '—'],
      ['Bathrooms',     a.bathrooms || '—', b.bathrooms || '—'],
      ['Furnished',     a.furnished ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>',
                        b.furnished ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>'],
      ['Parking',       a.parking   ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>',
                        b.parking   ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>'],
      ['WiFi',          a.wifi      ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>',
                        b.wifi      ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>'],
      ['Attached Bath', a.attached_bath ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>',
                        b.attached_bath ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>'],
      ['24hr Water',    a.water_24hr ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>',
                        b.water_24hr ? '<span class="check-yes">✓ Yes</span>' : '<span class="check-no">✗ No</span>'],
      ['Verified',      a.verified  ? '<span class="check-yes">✓ Verified</span>' : '—',
                        b.verified  ? '<span class="check-yes">✓ Verified</span>' : '—'],
    ];
    const html = `<table>
      <thead><tr><th>Feature</th><th>${a.title.slice(0,30)}…</th><th>${b.title.slice(0,30)}…</th></tr></thead>
      <tbody>${rows.map(([f,va,vb]) => `<tr><td><strong>${f}</strong></td><td>${va}</td><td>${vb}</td></tr>`).join('')}</tbody>
    </table>
    <div style="display:flex;gap:12px;margin-top:16px">
      <a href="property.html?id=${a.id}" class="btn btn-primary" style="flex:1;justify-content:center">View ${a.title.slice(0,20)}…</a>
      <a href="property.html?id=${b.id}" class="btn btn-primary" style="flex:1;justify-content:center">View ${b.title.slice(0,20)}…</a>
    </div>`;
    document.getElementById('compareTable').innerHTML = html;
    document.getElementById('compareModal').style.display = 'block';
  }

  // ── AI Smart Search ───────────────────────────
  async function runAISearch() {
    const query = document.getElementById('aiSearchInput').value.trim();
    if (!query) return;
    const status = document.getElementById('aiStatus');
    status.textContent = '🤖 Analysing your request…';

    try {
      const listingSummaries = allListings.map(p => ({
        id: String(p.id), title: p.title, type: p.type, purpose: p.purpose,
        price: p.price, city: p.city, location: p.location,
        bedrooms: p.bedrooms, bathrooms: p.bathrooms,
        furnished: p.furnished, parking: p.parking, wifi: p.wifi,
        attached_bath: p.attached_bath, water_24hr: p.water_24hr,
        features: p.features || []
      }));

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: `You are a property search assistant for GharKhoj, a Nepal real estate platform.
Given a user's natural language search query and a list of property listings (as JSON),
return ONLY a JSON object with this exact shape:
{"ids": ["1","3","7"], "message": "3 properties match your search"}
The "ids" array contains the IDs of matching listings, best matches first.
Return ONLY the JSON object, no markdown, no explanation.`,
          messages: [{
            role: 'user',
            content: `Search query: "${query}"

Available listings:
${JSON.stringify(listingSummaries, null, 2)}`
          }]
        })
      });

      const data = await res.json();
      const text = data.content?.[0]?.text || '{}';
      const result = JSON.parse(text.replace(/```json|```/g, '').trim());

      if (result.ids && result.ids.length > 0) {
        aiFilteredIds = result.ids;
        status.textContent = `✅ ${result.message || result.ids.length + ' results found'}`;
        applyFilters();
      } else {
        aiFilteredIds = [];
        status.textContent = '😔 No matching properties found. Try different words.';
        applyFilters();
      }
    } catch (err) {
      status.textContent = '⚠️ AI search unavailable. Using regular search instead.';
      document.getElementById('searchQ').value = query;
      applyFilters();
    }
  }

  function clearAISearch() {
    aiFilteredIds = null;
    document.getElementById('aiStatus').textContent = '';
    applyFilters();
  }

  function clearFilters() {
    ['searchQ','filterType','filterPurpose','filterCity','filterPrice'].forEach(id => {
      document.getElementById(id).value = '';
    });
    ['f-furnished','f-parking','f-wifi','f-attached','f-water'].forEach(id => {
      document.getElementById(id).checked = false;
    });
    document.getElementById('budgetSlider').value = 100000;
    document.getElementById('budgetLabel').textContent = 'Any';
    document.getElementById('aiSearchInput').value = '';
    document.getElementById('aiStatus').textContent = '';
    aiFilteredIds = null;
    applyFilters();
  }

  // Attach live filter events
  ['searchQ','filterType','filterPurpose','filterCity','filterPrice'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('change', applyFilters);
    if (el.tagName === 'INPUT') el.addEventListener('input', applyFilters);
  });

  function goPage(n) {
    currentPage = n;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Handle ?ai= param (from homepage AI search)
  function initFromURL() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('q'))       document.getElementById('searchQ').value = p.get('q');
    if (p.get('type'))    document.getElementById('filterType').value = p.get('type');
    if (p.get('purpose')) document.getElementById('filterPurpose').value = p.get('purpose');
    if (p.get('city'))    document.getElementById('filterCity').value = p.get('city');
    if (p.get('ai')) {
      const aiQ = p.get('ai');
      document.getElementById('aiSearchInput').value = aiQ;
    }
    updatePageTitle();
  }

  // Init
  renderCards = applyFilters;
  async function init() {
    await loadListings();
    initFromURL();
    applyFilters();

    // If AI query was passed, run it after data is loaded
    const aiParam = new URLSearchParams(window.location.search).get('ai');
    if (aiParam) {
      await runAISearch();
    }

    try {
      const { loadListingsFromFirestore } = await import('../js/firebase-services.js');
      const fetched = await loadListingsFromFirestore();
      if (fetched && fetched.length > 0) {
        allListings = fetched;
        applyFilters();
      }
    } catch (e) {}
  }
  init();
  setLang(currentLang);
</script>
