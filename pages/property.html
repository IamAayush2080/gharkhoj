<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Property Detail — GharKhoj.com.np</title>
  <meta name="description" id="meta-desc" content="View property details on GharKhoj — Nepal's trusted property search.">
  <link rel="canonical" id="meta-canonical" href="https://gharkhoj.com.np/pages/property.html">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="GharKhoj.com.np">
  <meta property="og:title" id="og-title" content="Property — GharKhoj.com.np">
  <meta property="og:description" id="og-desc" content="View property details on GharKhoj.">
  <meta property="og:url" id="og-url" content="https://gharkhoj.com.np/pages/property.html">
  <meta property="og:image" id="og-image" content="https://gharkhoj.com.np/images/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="tw-title" content="Property — GharKhoj.com.np">
  <meta name="twitter:image" id="tw-image" content="https://gharkhoj.com.np/images/og-image.svg">
  <!-- Google Analytics -->
  <!-- Google Analytics — replace G-XXXXXXXXXX with your real Measurement ID -->
  <!-- Get yours free at: https://analytics.google.com → Admin → Create Property -->
  <script>
    const GA_ID = 'G-XXXXXXXXXX'; // ← Replace this
    if (GA_ID !== 'G-XXXXXXXXXX') {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', GA_ID);
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🏠</text></svg>">
  <style>
    .breadcrumb {
      padding: 12px 0;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .breadcrumb a { color: var(--blue); }
    .breadcrumb a:hover { text-decoration: underline; }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      align-items: start;
    }

    /* Gallery */
    .gallery { border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; }
    .gallery-main {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
      background: var(--border);
      cursor: pointer;
    }
    .gallery-thumbs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .gallery-thumb {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 7px;
      cursor: pointer;
      opacity: 0.65;
      transition: opacity 0.15s;
      flex-shrink: 0;
      border: 2px solid transparent;
    }
    .gallery-thumb.active, .gallery-thumb:hover { opacity: 1; border-color: var(--blue); }

    /* Property Info */
    .property-header { margin-bottom: 20px; }
    .property-header h1 { font-size: 26px; margin-bottom: 6px; }
    .property-location { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
    .property-price { font-size: 30px; font-weight: 700; color: var(--blue); }
    .property-badges { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .meta-box {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .meta-box .meta-icon { font-size: 22px; margin-bottom: 4px; }
    .meta-box .meta-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
    .meta-box .meta-val  { font-size: 16px; font-weight: 700; color: var(--slate); margin-top: 2px; }

    .features-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }
    .feature-tag {
      background: var(--blue-light);
      color: var(--blue-dark);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 500;
    }

    .description-section h3 { margin-bottom: 10px; }
    .description-section p  { color: var(--slate-mid); line-height: 1.75; }

    /* Contact Card */
    .contact-card {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: sticky;
      top: calc(var(--nav-h) + 16px);
      box-shadow: var(--shadow-md);
    }
    .contact-card h3 { margin-bottom: 4px; }
    .contact-card .posted { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .contact-card .price-big { font-size: 28px; font-weight: 700; color: var(--blue); margin-bottom: 20px; }
    .contact-actions { display: flex; flex-direction: column; gap: 10px; }

    .safety-tip {
      margin-top: 16px;
      padding: 12px;
      background: #FEF3C7;
      border-radius: 9px;
      font-size: 12px;
      color: #78350F;
      line-height: 1.5;
    }

    .map-section { margin-top: 28px; }
    .map-section h3 { margin-bottom: 12px; }
    .map-placeholder {
      width: 100%;
      height: 240px;
      background: #e8f0fe;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      gap: 8px;
      font-size: 14px;
      border: 1.5px solid var(--border);
    }

    /* Similar Listings */
    .similar-section { margin-top: 48px; }
    .similar-section h2 { margin-bottom: 24px; }

    @media (max-width: 900px) {
      .detail-layout { grid-template-columns: 1fr; }
      .contact-card { position: static; }
      .gallery-main { height: 280px; }
    }
    @media (max-width: 600px) {
      .meta-grid { grid-template-columns: repeat(2, 1fr); }
      .gallery-main { height: 220px; }
    }
  </style>
</head>
<body>

<div id="navbar-root"></div>

<div class="container">
  <div class="breadcrumb" id="breadcrumb">
    <a href="../index.html">Home</a> ›
    <a href="listings.html">Properties</a> ›
    <span id="breadcrumb-title">Loading...</span>
  </div>
</div>

<div class="container section-sm" id="propertyDetail">
  <!-- skeleton -->
  <div class="detail-layout">
    <div>
      <div class="skeleton" style="height:420px;border-radius:16px;margin-bottom:24px"></div>
      <div class="skeleton" style="height:30px;width:60%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:20px;width:40%"></div>
    </div>
    <div>
      <div class="skeleton" style="height:400px;border-radius:16px"></div>
    </div>
  </div>
</div>

<div class="container">
  <div class="similar-section">
    <h2>Similar Properties</h2>
    <div class="grid-3" id="similarGrid"></div>
  </div>
</div>

<div style="margin-top:48px" id="footer-root"></div>

<script src="../js/core.js"></script>
<script>
  document.getElementById('navbar-root').innerHTML = buildNavbar('nav_listings');
  document.getElementById('footer-root').innerHTML = buildFooter();

  let property = null;
  let activeImg = 0;

  async function init() {
    // Load JSON first (fast, always works)
    await loadListings();
    // Match by ID regardless of whether stored as int or string
    const idRaw = getParam('id');
    property = allListings.find(p => String(p.id) === String(idRaw));

    // If not in JSON, try Firestore (for user-submitted approved listings)
    if (!property) {
      try {
        const { loadListingsFromFirestore } = await import('../js/firebase-services.js');
        const fetched = await loadListingsFromFirestore();
        if (fetched && fetched.length > 0) {
          allListings = fetched;
          property = allListings.find(p => String(p.id) === String(idRaw));
        }
      } catch(e) {}
    }

    if (!property) {
      document.getElementById('propertyDetail').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🏠</div>
          <h3>Property not found</h3>
          <p>This listing may have been removed.</p>
          <a href="listings.html" class="btn btn-primary" style="margin-top:16px">Browse All Properties</a>
        </div>`;
      return;
    }

    renderDetail();
    renderSimilar();
    document.title = property.title + ' — GharKhoj.com.np';
    setLang(currentLang);
  }

  function renderDetail() {
    const p = property;
    const lang = currentLang;
    const title = lang === 'np' && p.title_np ? p.title_np : p.title;
    const desc  = lang === 'np' && p.description_np ? p.description_np : p.description;

    document.getElementById('breadcrumb-title').textContent = title;

    const imgs = p.images && p.images.length ? p.images : ['https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800&q=80'];

    const thumbsHTML = imgs.length > 1
      ? `<div class="gallery-thumbs">${imgs.map((src, i) =>
          `<img class="gallery-thumb${i===0?' active':''}" src="${src}" alt="Photo ${i+1}" onclick="setImg(${i})" loading="lazy">`
        ).join('')}</div>`
      : '';

    const metaBoxes = [
      p.bedrooms  > 0 ? `<div class="meta-box"><div class="meta-icon">🛏</div><div class="meta-label">${t('bedrooms')}</div><div class="meta-val">${p.bedrooms}</div></div>` : '',
      p.bathrooms > 0 ? `<div class="meta-box"><div class="meta-icon">🚿</div><div class="meta-label">${t('bathrooms')}</div><div class="meta-val">${p.bathrooms}</div></div>` : '',
      p.area ? `<div class="meta-box"><div class="meta-icon">📐</div><div class="meta-label">${t('area')}</div><div class="meta-val">${p.area}</div></div>` : '',
    ].filter(Boolean).join('');

    const featuresHTML = p.features && p.features.length
      ? `<div class="features-list">${p.features.map(f => `<span class="feature-tag">✓ ${f}</span>`).join('')}</div>`
      : '';

    document.getElementById('propertyDetail').innerHTML = `
      <div class="detail-layout">
        <div>
          <div class="gallery">
            <img class="gallery-main" id="mainImg" src="${imgs[0]}" alt="${title}">
            ${thumbsHTML}
          </div>

          <div class="property-header">
            <h1 id="propTitle">${title}</h1>
            <div class="property-location">📍 ${p.location}, ${p.city}, ${p.district}</div>
            <div class="property-price">${p.price_label}</div>
            <div class="property-badges">
              ${p.verified ? `<span class="badge badge-verified">✓ ${t('verified')}</span>` : ''}
              ${p.featured ? `<span class="badge badge-featured">★ ${t('featured_badge')}</span>` : ''}
              <span class="badge ${p.purpose === 'rent' ? 'badge-rent' : 'badge-buy'}">${p.purpose === 'rent' ? t('filter_rent') : t('filter_buy')}</span>
              <span class="badge badge-new">${p.type.charAt(0).toUpperCase() + p.type.slice(1)}</span>
            </div>
          </div>

          ${metaBoxes ? `<div class="meta-grid">${metaBoxes}</div>` : ''}

          <div class="description-section">
            <h3>Description</h3>
            <p id="propDesc">${desc}</p>
            ${featuresHTML}
          </div>

          <div class="map-section">
            <h3>📍 Location</h3>
            ${(p.lat && p.lng)
              ? `<iframe
                  title="Property location"
                  width="100%" height="240"
                  style="border:0;border-radius:var(--radius);display:block"
                  loading="lazy"
                  src="https://www.openstreetmap.org/export/embed.html?bbox=${parseFloat(p.lng)-0.005},${parseFloat(p.lat)-0.005},${parseFloat(p.lng)+0.005},${parseFloat(p.lat)+0.005}&layer=mapnik&marker=${p.lat},${p.lng}"
                 ></iframe>
                 <a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener" style="font-size:13px;color:var(--blue);display:inline-block;margin-top:8px">📍 Open in Google Maps ↗</a>`
              : `<div class="map-placeholder">
                  <span style="font-size:32px">🗺️</span>
                  <span>${p.location}, ${p.city}</span>
                  <a href="https://www.google.com/maps/search/${encodeURIComponent(p.location+' '+p.city+' Nepal')}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">Find on Google Maps</a>
                </div>`
            }
          </div>
        </div>

        <div>
          <div class="contact-card">
            <h3>${t('contact_owner')}</h3>
            <div class="posted">Posted ${timeAgo(p.posted)} · ${p.city}</div>
            <div class="price-big">${p.price_label}</div>
            ${p.status === 'sold' || p.status === 'rented' ? `
            <div class="alert alert-warning" style="margin-bottom:14px">
              🔒 This property is <strong>${p.status === 'sold' ? 'Sold' : 'Rented'}</strong> and no longer available.
            </div>` : `
            <div class="contact-actions">
              <a href="tel:${p.contact}" class="btn btn-primary btn-lg btn-block">
                📞 ${t('contact_owner')}
              </a>
              <a href="https://wa.me/${p.whatsapp}?text=Hi%2C+I+saw+your+listing+on+GharKhoj%3A+${encodeURIComponent(p.title)}+%E2%80%94+${encodeURIComponent('https://gharkhoj.com.np/pages/property.html?id=' + p.id)}"
                 target="_blank" rel="noopener"
                 class="btn btn-whatsapp btn-lg btn-block">
                💬 ${t('whatsapp')}
              </a>
            </div>`}

            <!-- Wishlist button -->
            <button id="wishlistBtn" class="btn btn-outline btn-block" style="margin-top:10px;width:100%;justify-content:center">
              🤍 Save to Wishlist
            </button>

            <!-- Share row -->
            <div style="margin-top:14px;padding-top:14px;border-top:1.5px solid var(--border)">
              <div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Share this listing</div>
              <div style="display:flex;gap:8px">
                <a href="https://wa.me/?text=${encodeURIComponent('Check this property on GharKhoj: ' + p.title + ' — ' + p.price_label + '\n' + 'https://gharkhoj.com.np/pages/property.html?id=' + p.id)}"
                   target="_blank" rel="noopener"
                   class="btn btn-sm" style="background:#25D366;color:white;flex:1;justify-content:center">
                  📤 WhatsApp
                </a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent('https://gharkhoj.com.np/pages/property.html?id=' + p.id)}"
                   target="_blank" rel="noopener"
                   class="btn btn-sm" style="background:#1877F2;color:white;flex:1;justify-content:center">
                  📘 Facebook
                </a>
                <button onclick="copyLink()" class="btn btn-sm btn-outline" style="flex:1" id="copyBtn">
                  🔗 Copy
                </button>
              </div>
            </div>

            <div class="safety-tip">
              ⚠️ <strong>Safety tip:</strong> ${t('disclaimer')}
            </div>

            <!-- Nearby Facilities Score -->
            ${p.nearby ? (() => {
              const n = p.nearby;
              function scoreItem(m) {
                if (!m || m === 0) return null;
                if (m <= 300)  return {emoji:'🟢', label: m < 100 ? 'Next door' : m + 'm'};
                if (m <= 800)  return {emoji:'🟡', label: m + 'm'};
                if (m <= 1500) return {emoji:'🟠', label: (m/1000).toFixed(1) + 'km'};
                return           {emoji:'🔴', label: (m/1000).toFixed(1) + 'km'};
              }
              const items = [
                {icon:'🏫', label:'College',  s: scoreItem(n.college)},
                {icon:'🚌', label:'Bus Stop', s: scoreItem(n.bus_stop)},
                {icon:'🏥', label:'Hospital', s: scoreItem(n.hospital)},
                {icon:'🛒', label:'Market',   s: scoreItem(n.market)},
              ].filter(x => x.s);
              const avgScore = items.reduce((a, x) => {
                const d = [300,800,1500,9999];
                const sc = [100,75,50,25];
                const dist = parseInt(x.s.label) || 9999;
                return a + sc[d.findIndex(t => dist <= t)];
              }, 0) / (items.length || 1);
              const scoreColor = avgScore >= 75 ? '#16a34a' : avgScore >= 50 ? '#d97706' : '#dc2626';
              return `<div style="margin-top:14px;padding:12px;background:#f8faff;border-radius:10px;border:1.5px solid #e0eaff">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">📍 Nearby Facilities</div>
                  <div style="font-size:13px;font-weight:700;color:${scoreColor}">Score: ${Math.round(avgScore)}/100</div>
                </div>
                ${items.map(x => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
                  <span>${x.icon} ${x.label}</span>
                  <span>${x.s.emoji} ${x.s.label}</span>
                </div>`).join('')}
              </div>`;
            })() : ''}

            <!-- Cost Calculator -->
            <div style="margin-top:14px;padding:14px;background:var(--blue-light);border-radius:10px;border:1.5px solid #bfdbfe">
              <div style="font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px">💰 Monthly Cost Estimate</div>
              <div style="font-size:13px;color:var(--blue-dark)">
                <div style="display:flex;justify-content:space-between;padding:3px 0">
                  <span>Rent</span><span style="font-weight:600">Rs ${p.price.toLocaleString()}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:3px 0;align-items:center">
                  <span>Electricity (est.)</span>
                  <input type="number" id="costElec" value="1000" min="0" max="10000" step="100"
                    style="width:80px;text-align:right;border:1px solid #bfdbfe;border-radius:5px;padding:2px 6px;font-size:13px;background:white"
                    oninput="calcCost(${p.price})">
                </div>
                <div style="display:flex;justify-content:space-between;padding:3px 0;align-items:center">
                  <span>Internet (est.)</span>
                  <input type="number" id="costNet" value="${p.wifi ? 0 : 700}" min="0" max="5000" step="100"
                    style="width:80px;text-align:right;border:1px solid #bfdbfe;border-radius:5px;padding:2px 6px;font-size:13px;background:white"
                    oninput="calcCost(${p.price})">
                </div>
                <div style="display:flex;justify-content:space-between;padding:3px 0;align-items:center">
                  <span>Water/Maintenance</span>
                  <input type="number" id="costWater" value="300" min="0" max="3000" step="100"
                    style="width:80px;text-align:right;border:1px solid #bfdbfe;border-radius:5px;padding:2px 6px;font-size:13px;background:white"
                    oninput="calcCost(${p.price})">
                </div>
                <div style="border-top:1px solid #bfdbfe;margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-weight:700;font-size:14px">
                  <span>Total / month</span>
                  <span id="costTotal" style="color:var(--blue)">Rs ${(p.price + 1000 + (p.wifi ? 0 : 700) + 300).toLocaleString()}</span>
                </div>
              </div>
            </div>

            <!-- Report Listing -->
            <div style="margin-top:10px;text-align:center">
              <button onclick="reportListing('${p.id}','${p.title.replace(/'/g,'')}')" 
                style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline">
                🚩 Report this listing
              </button>
            </div>

          </div>
        </div>
      </div>`;

    // Update OG meta tags dynamically for accurate sharing
    const pageUrl = 'https://gharkhoj.com.np/pages/property.html?id=' + p.id;
    const ogImg   = (p.images && p.images[0]) ? p.images[0] : 'https://gharkhoj.com.np/images/og-image.svg';
    const ogDesc  = `${p.price_label} · ${p.location}, ${p.city} · ${p.type} ${p.purpose === 'rent' ? 'for rent' : 'for sale'} on GharKhoj`;

    document.title = p.title + ' — GharKhoj.com.np';
    document.querySelector('#meta-desc')      && (document.querySelector('#meta-desc').content      = ogDesc);
    document.querySelector('#og-title')       && (document.querySelector('#og-title').content       = p.title + ' — GharKhoj');
    document.querySelector('#og-desc')        && (document.querySelector('#og-desc').content        = ogDesc);
    document.querySelector('#og-url')         && (document.querySelector('#og-url').content         = pageUrl);
    document.querySelector('#og-image')       && (document.querySelector('#og-image').content       = ogImg);
    document.querySelector('#tw-title')       && (document.querySelector('#tw-title').content       = p.title + ' — GharKhoj');
    document.querySelector('#tw-image')       && (document.querySelector('#tw-image').content       = ogImg);
    document.querySelector('#meta-canonical') && (document.querySelector('#meta-canonical').href    = pageUrl);
  }

  function copyLink() {
    const url = 'https://gharkhoj.com.np/pages/property.html?id=' + property.id;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ Copied!';
      setTimeout(() => btn.textContent = '🔗 Copy', 2000);
    }).catch(() => {
      prompt('Copy this link:', url);
    });
  }

  function setImg(idx) {
    activeImg = idx;
    const imgs = property.images;
    document.getElementById('mainImg').src = imgs[idx];
    document.querySelectorAll('.gallery-thumb').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
  }

  function renderSimilar() {
    const p = property;
    const similar = allListings
      .filter(x => x.id !== p.id && (x.type === p.type || x.city === p.city))
      .slice(0, 3);
    document.getElementById('similarGrid').innerHTML =
      similar.length ? similar.map(propertyCardHTML).join('') : '';
  }

  init();

  // Cost calculator
  window.calcCost = function(rent) {
    const elec  = Number(document.getElementById('costElec')?.value  || 0);
    const net   = Number(document.getElementById('costNet')?.value   || 0);
    const water = Number(document.getElementById('costWater')?.value || 0);
    const el = document.getElementById('costTotal');
    if (el) el.textContent = 'Rs ' + (rent + elec + net + water).toLocaleString();
  };

  // Report listing
  window.reportListing = function(id, title) {
    const reason = prompt('Report "' + title + '"\n\nSelect reason:\n1. Fake/Scam\n2. Wrong price\n3. Already rented/sold\n4. Inappropriate content\n5. Other\n\nType number or describe:');
    if (!reason) return;
    const reports = JSON.parse(localStorage.getItem('gk_reports') || '[]');
    reports.push({ id, title, reason, time: new Date().toISOString() });
    localStorage.setItem('gk_reports', JSON.stringify(reports));
    const btns = document.querySelectorAll('[onclick*="reportListing"]');
    btns.forEach(b => { b.textContent = '✅ Reported — Thank you'; b.disabled = true; });
    alert('Thank you for reporting. We will review this listing within 24 hours.');
  };

  // Wishlist button on property page
  (function() {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) return;
    const btn = document.getElementById('wishlistBtn');
    if (!btn) return;
    const wl = JSON.parse(localStorage.getItem('gk_wishlist') || '[]');
    if (wl.includes(id)) { btn.innerHTML = '❤️ Saved'; btn.style.background = '#fef2f2'; }
    btn.onclick = function() {
      const w = JSON.parse(localStorage.getItem('gk_wishlist') || '[]');
      const i = w.indexOf(id);
      if (i === -1) { w.push(id); btn.innerHTML = '❤️ Saved'; btn.style.background = '#fef2f2'; }
      else          { w.splice(i,1); btn.innerHTML = '🤍 Save'; btn.style.background = ''; }
      localStorage.setItem('gk_wishlist', JSON.stringify(w));
    };
  })();
</script>
</body>
</html>
