<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — GharKhoj.com.np</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🏠</text></svg>">
  <style>
    .error-page {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 20px;
    }
    .error-icon { font-size: 72px; margin-bottom: 16px; }
    .error-page h1 { font-size: 28px; margin-bottom: 8px; }
    .error-page p  { color: var(--muted); margin-bottom: 28px; max-width: 420px; }
    .error-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<div id="navbar-root"></div>

<div class="error-page">
  <div class="error-icon">🏚️</div>
  <h1>Page Not Found</h1>
  <p>The page you are looking for doesn't exist, or the property listing may have been removed.</p>
  <div class="error-actions">
    <a href="index.html" class="btn btn-primary">🏠 Go Home</a>
    <a href="pages/listings.html" class="btn btn-outline">Browse Properties</a>
  </div>
</div>

<div id="footer-root"></div>

<script src="js/core.js"></script>
<script>
  document.getElementById('navbar-root').innerHTML = buildNavbar('');
  document.getElementById('footer-root').innerHTML = buildFooter();
</script>
</body>
</html>
